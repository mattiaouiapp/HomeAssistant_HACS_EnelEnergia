stages:
  - test

tests:
  stage: test
  image: python:3.14-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip install -q -r requirements_test.txt
  script:
    - ruff check custom_components tests
    - python -m pytest -q -p no:cacheprovider
